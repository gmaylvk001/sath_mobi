  <rect x="79" y="52" width="3" height="2" fill="black" stroke="none" />
  <rect x="84" y="52" width="3" height="2" fill="black" stroke="none" />
  <rect x="89" y="52" width="3" height="2" fill="black" stroke="none" />
  <rect x="79" y="56" width="3" height="2" fill="black" stroke="none" />
  <rect x="84" y="56" width="3" height="2" fill="black" stroke="none" />
  <rect x="89" y="56" width="3" height="2" fill="black" stroke="none" />
  <!-- Circle Nav Pad -->
  <circle cx="84" cy="66" r="4" fill="none" stroke="black" stroke-width="3" />
  <circle cx="84" cy="66" r="1" fill="black" stroke="none" />
</svg>

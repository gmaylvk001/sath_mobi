<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="black">
  <!-- Sound Waves Left -->
  <path d="M 28 20 A 10 10 0 0 0 28 32" stroke="black" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 24 16 A 15 15 0 0 0 24 36" stroke="black" stroke-width="3" fill="none" stroke-linecap="round" />
  <!-- Sound Waves Right -->
  <path d="M 72 20 A 10 10 0 0 1 72 32" stroke="black" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 76 16 A 15 15 0 0 1 76 36" stroke="black" stroke-width="3" fill="none" stroke-linecap="round" />
  
  <!-- Left Earbud -->
  <circle cx="34" cy="26" r="5" />
  <rect x="33" y="26" width="7" height="4" rx="2" transform="rotate(30 33 26)" />
  <!-- Right Earbud -->
  <circle cx="66" cy="26" r="5" />
  <rect x="60" y="26" width="7" height="4" rx="2" transform="rotate(-30 66 26)" />

  <!-- Thin Wires -->
  <path d="M 36 30 Q 36 60, 28 72" stroke="black" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 64 30 Q 64 60, 42 75" stroke="black" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Neckband Main Loop -->
  <path d="M 26 72 C 30 45, 75 45, 75 72 C 75 88, 42 88, 42 75" stroke="black" stroke-width="7" fill="none" stroke-linecap="round" />

  <!-- Control Pod on Right End -->
  <rect x="42" y="62" width="26" height="25" rx="10" transform="rotate(45 55 74)" />
  <!-- Switch Button on Control Pod -->
  <rect x="52" y="68" width="8" height="4" rx="2" fill="white" transform="rotate(45 55 74)" />
</svg>
